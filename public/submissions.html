<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submissions - Admin | Trust Care Electronics</title>
    <link rel="icon" href="/logo.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: calc(100vh - 70px);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #fff 0%, #ffd1d1 35%, #ff5a5a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        .admin-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-export {
            background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
        }

        .btn-clear {
            background: linear-gradient(90deg, #ef4444 0%, #b91c1c 100%);
            color: white;
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a0d0d 0%, #2b0909 100%);
            border: 1px solid rgba(255, 86, 86, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 12px;
            color: #f0d0d0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #ff5a5a;
        }

        .table-container {
            overflow-x: auto;
            background: linear-gradient(135deg, #1a0d0d 0%, #2b0909 100%);
            border: 1px solid rgba(255, 86, 86, 0.3);
            border-radius: 10px;
            padding: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: rgba(214, 27, 27, 0.1);
            border-bottom: 2px solid rgba(255, 86, 86, 0.4);
        }

        table th {
            padding: 16px;
            text-align: left;
            color: #ff5a5a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table tbody tr {
            border-bottom: 1px solid rgba(255, 86, 86, 0.2);
            transition: background 0.2s ease;
        }

        table tbody tr:hover {
            background: rgba(255, 86, 86, 0.05);
        }

        table td {
            padding: 14px 16px;
            color: #f5f5f5;
        }

        .product-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 86, 86, 0.2);
            border: 1px solid rgba(255, 86, 86, 0.4);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #ffd1d1;
        }

        .timestamp {
            font-size: 12px;
            color: #b0b0b0;
        }

        .message-preview {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #b0b0b0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a0d0d;
            border: 1px solid rgba(255, 86, 86, 0.3);
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #ff5a5a;
            margin: 0 0 10px 0;
        }

        .modal-body {
            color: #f5f5f5;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .modal-field {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 86, 86, 0.2);
        }

        .modal-field:last-child {
            border-bottom: none;
        }

        .modal-label {
            font-size: 12px;
            color: #ff5a5a;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .modal-value {
            color: #f0d0d0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-close-modal {
            background: #404040;
            color: #fff;
        }

        .btn-close-modal:hover {
            background: #505050;
        }

        .btn-delete-modal {
            background: #ef4444;
            color: #fff;
        }

        .btn-delete-modal:hover {
            background: #dc2626;
        }

        .no-submissions {
            text-align: center;
            padding: 40px;
            color: #b0b0b0;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-controls {
                width: 100%;
                justify-content: space-between;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 10px;
            }

            .message-preview {
                max-width: 100px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <button class="menu-button" id="menuButton">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1 onclick="window.location.href='index.html'" style="cursor: pointer; margin: 0;">Trust Care Electronics</h1>
        
        <nav class="header-nav">
            <a href="index.html">Home</a>
            <span class="nav-separator">|</span>
            <a href="inverter.html">Inverter</a>
            <span class="nav-separator">|</span>
            <a href="battery.html">Battery</a>
            <span class="nav-separator">|</span>
            <a href="ups.html">UPS</a>
            <span class="nav-separator">|</span>
            <a href="about.html">About us</a>
        </nav>
        
        <a href="index.html" class="header-logo-link">
            <img src="/logo.jpeg" alt="Trust Care Electronics Logo" class="header-logo">
        </a>
    </header>

    <!-- Side Menu -->
    <nav class="side-menu" id="sideMenu">
        <button class="close-button" id="closeButton">&times;</button>
        <h2>Menu</h2>
        <a href="index.html">Home</a>
        <a href="submissions.html">Submissions</a>
    </nav>

    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main>
        <div class="admin-container">
            <div class="admin-header">
                <h1>📋 Form Submissions</h1>
                <div class="admin-controls">
                    <button class="admin-btn btn-export" onclick="exportToCSV()">Export CSV</button>
                    <button class="admin-btn btn-clear" onclick="confirmClearAll()">Clear All</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-card">
                    <div class="label">Total Submissions</div>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Inverter</div>
                    <div class="value" id="inverterCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Battery</div>
                    <div class="value" id="batteryCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">UPS</div>
                    <div class="value" id="upsCount">0</div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div id="submissionsTable"></div>
            </div>
        </div>
    </main>

    <!-- Modal for viewing full details -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📝 Submission Details</h3>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-actions">
                <button class="modal-actions button btn-close-modal" onclick="closeModal()">Close</button>
                <button class="modal-actions button btn-delete-modal" onclick="deleteFromModal()">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let currentSubmissionIndex = -1;

        function loadSubmissions() {
            const submissions = JSON.parse(localStorage.getItem("inquiries")) || [];
            const container = document.getElementById("submissionsTable");

            // Update stats
            updateStats(submissions);

            if (submissions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h2>No Submissions Yet</h2>
                        <p>Form submissions will appear here when customers submit the inquiry form.</p>
                    </div>
                `;
                return;
            }

            // Build table
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Product</th>
                            <th>Message</th>
                            <th>Submitted</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            submissions.forEach((submission, index) => {
                html += `
                    <tr>
                        <td>${escapeHtml(submission.name)}</td>
                        <td><a href="tel:${submission.phone}" style="color: #ff5a5a; text-decoration: none;">${submission.phone}</a></td>
                        <td><a href="mailto:${submission.email}" style="color: #ff5a5a; text-decoration: none;">${submission.email || '-'}</a></td>
                        <td><span class="product-badge">${submission.product}</span></td>
                        <td><div class="message-preview" title="${escapeHtml(submission.message)}">${escapeHtml(submission.message)}</div></td>
                        <td><span class="timestamp">${new Date(submission.timestamp).toLocaleDateString()}</span></td>
                        <td>
                            <button class="delete-btn" onclick="viewDetails(${index})">View</button>
                            <button class="delete-btn" onclick="deleteSubmission(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function updateStats(submissions) {
            document.getElementById("totalCount").textContent = submissions.length;
            document.getElementById("inverterCount").textContent = submissions.filter(s => s.product === "Inverter").length;
            document.getElementById("batteryCount").textContent = submissions.filter(s => s.product === "Battery").length;
            document.getElementById("upsCount").textContent = submissions.filter(s => s.product === "UPS").length;
        }

        function viewDetails(index) {
            const submissions = JSON.parse(localStorage.getItem("inquiries")) || [];
            const submission = submissions[index];
            currentSubmissionIndex = index;

            const modal = document.getElementById("detailsModal");
            const modalBody = document.getElementById("modalBody");

            modalBody.innerHTML = `
                <div class="modal-field">
                    <div class="modal-label">Name</div>
                    <div class="modal-value">${escapeHtml(submission.name)}</div>
                </div>
                <div class="modal-field">
                    <div class="modal-label">Phone</div>
                    <div class="modal-value"><a href="tel:${submission.phone}" style="color: #ff5a5a;">${submission.phone}</a></div>
                </div>
                <div class="modal-field">
                    <div class="modal-label">Email</div>
                    <div class="modal-value"><a href="mailto:${submission.email}" style="color: #ff5a5a;">${submission.email || 'Not provided'}</a></div>
                </div>
                <div class="modal-field">
                    <div class="modal-label">Product Interest</div>
                    <div class="modal-value"><span class="product-badge">${submission.product}</span></div>
                </div>
                <div class="modal-field">
                    <div class="modal-label">Message</div>
                    <div class="modal-value">${escapeHtml(submission.message)}</div>
                </div>
                <div class="modal-field">
                    <div class="modal-label">Submitted On</div>
                    <div class="modal-value">${new Date(submission.timestamp).toLocaleString()}</div>
                </div>
            `;

            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById("detailsModal").style.display = "none";
            currentSubmissionIndex = -1;
        }

        function deleteSubmission(index) {
            if (confirm("Are you sure you want to delete this submission?")) {
                const submissions = JSON.parse(localStorage.getItem("inquiries")) || [];
                submissions.splice(index, 1);
                localStorage.setItem("inquiries", JSON.stringify(submissions));
                loadSubmissions();
            }
        }

        function deleteFromModal() {
            if (currentSubmissionIndex !== -1) {
                deleteSubmission(currentSubmissionIndex);
                closeModal();
            }
        }

        function confirmClearAll() {
            if (confirm("Are you sure you want to delete ALL submissions? This cannot be undone.")) {
                localStorage.setItem("inquiries", JSON.stringify([]));
                loadSubmissions();
            }
        }

        function exportToCSV() {
            const submissions = JSON.parse(localStorage.getItem("inquiries")) || [];
            if (submissions.length === 0) {
                alert("No submissions to export!");
                return;
            }

            let csv = "Name,Phone,Email,Product,Message,Submitted\n";

            submissions.forEach(submission => {
                const escapedMessage = `"${submission.message.replace(/"/g, '""')}"`;
                const escapedName = `"${submission.name.replace(/"/g, '""')}"`;
                csv += `${escapedName},${submission.phone},${submission.email || ''},${submission.product},${escapedMessage},"${new Date(submission.timestamp).toLocaleString()}"\n`;
            });

            const blob = new Blob([csv], { type: "text/csv" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `inquiries-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            if (!text) return "";
            const map = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Close modal when clicking outside
        document.getElementById("detailsModal").addEventListener("click", (e) => {
            if (e.target.id === "detailsModal") {
                closeModal();
            }
        });

        // Load submissions on page load
        loadSubmissions();
    </script>
</body>

</html>
